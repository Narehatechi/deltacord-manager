name: Screenshots

# Renders each screen (Paparazzi, no phone needed) and keeps the pictures on the `screenshots`
# branch, so the look can be checked before a release.
on:
    push:
        branches: [redesign]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: screenshots
    cancel-in-progress: true

jobs:
    screenshots:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - uses: burrunan/gradle-cache-action@v2

            - name: Render
              run: ./gradlew :app:recordPaparazziDebug --no-daemon --stacktrace 2>&1 | tee render.txt; exit ${PIPESTATUS[0]}

            - name: Keep the pictures (and the log)
              if: always()
              run: |
                  mkdir -p /tmp/shots
                  cp app/src/test/snapshots/images/*.png /tmp/shots/ 2>/dev/null || true
                  # Errors only, so they fit in the log file.
                  grep -E "^e: |error:|FAILED|Exception|What went wrong" -A3 render.txt | head -300 > /tmp/shots/errors.txt || true
                  for f in app/build/test-results/testDebugUnitTest/*.xml; do head -c 20000 "$f" >> /tmp/shots/tests.txt 2>/dev/null; done || true
                  echo "${{ github.sha }}" > /tmp/shots/commit.txt
                  cd /tmp/shots
                  git init -q && git checkout -q -b screenshots
                  git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A && git commit -q -m "Screenshots for ${{ github.sha }}"
                  git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
